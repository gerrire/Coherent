services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coherent
      POSTGRES_USER: coherent
      POSTGRES_PASSWORD: coherent
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - coherent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coherent -d coherent"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["calls"]
    restart: unless-stopped
    network_mode: host
    command: ["--dev"]

volumes:
  coherent-postgres:
