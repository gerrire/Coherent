name: coherent-staging

x-limits: &limits
  restart: unless-stopped
  pids_limit: 128
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  web:
    <<: *limits
    image: coherent-web:${STAGING_IMAGE_TAG:?}
    command: ["caddy", "run", "--config", "/etc/caddy/staging", "--adapter", "caddyfile"]
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    cap_drop: [ALL]
    mem_limit: 128m
    ports: ["10.205.40.2:18080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/staging:ro"]
    networks: [edge, app]
    depends_on:
      api:
        condition: service_healthy
  api:
    <<: *limits
    image: coherent-api:${STAGING_IMAGE_TAG:?}
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 384m
    networks: [app]
    environment:
      APP_ENV: staging
      TEST_EMAIL_VERIFICATION_BYPASS: "true"
      SECRET_KEY: ${STAGING_SECRET_KEY:?}
      DATABASE_URL: postgresql+asyncpg://coherent:${STAGING_DB_PASSWORD:?}@postgres:5432/coherent_staging
      CORS_ORIGINS: '["https://dev.coherent-web.ru"]'
      COOKIE_SECURE: "true"
      CHAT_MASTER_KEY_PATH: /run/staging-master-key
      CLOUD_ENCRYPTION_REQUIRED: "true"
      LIVEKIT_URL: wss://dev.coherent-web.ru/livekit
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${STAGING_LIVEKIT_KEY:?}
      LIVEKIT_API_SECRET: ${STAGING_LIVEKIT_SECRET:?}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      SMTP_FROM: noreply@dev.coherent-web.ru
      ATTACHMENT_DIR: /data/attachments
      ATTACHMENT_STORAGE_LIMIT_MB: "512"
      ATTACHMENT_MIN_FREE_MB: "256"
      E2EE_STORAGE_LIMIT_MB: "256"
      E2EE_MESSAGING_ENABLED: "true"
      VAPID_KEY_PATH: /data/vapid/private.pem
      VAPID_SUBJECT: https://dev.coherent-web.ru
    volumes:
      - attachments:/data/attachments
      - vapid:/data/vapid
      - ./master-key:/run/staging-master-key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  postgres:
    <<: *limits
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=32"]
    mem_limit: 256m
    networks: [app]
    environment:
      POSTGRES_DB: coherent_staging
      POSTGRES_USER: coherent
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "coherent", "-d", "coherent_staging"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    <<: *limits
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 80m
    networks: [app]
  livekit:
    <<: *limits
    image: livekit/livekit-server@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    read_only: true
    cap_drop: [ALL]
    mem_limit: 384m
    networks:
      edge:
        interface_name: edge0
      app:
        interface_name: app0
    ports: ["10.205.40.2:17881:17881/tcp", "10.205.40.2:17882:17882/udp", "10.205.40.2:13478:13478/udp", "10.205.40.2:14000-14031:14000-14031/udp"]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 17881
          udp_port: 17882
          use_external_ip: false
          use_ice_lite: true
          node_ip: 31.76.77.197
          interfaces:
            includes: [edge0]
        turn:
          enabled: true
          domain: dev.coherent-web.ru
          udp_port: 13478
          tls_port: 0
          relay_range_start: 14000
          relay_range_end: 14031
          per_user_relay_allocation_limit: 4
        redis:
          address: redis:6379
        webhook:
          api_key: "${STAGING_LIVEKIT_KEY}"
          urls: ["http://api:8000/api/v1/calls/media-events"]
        keys:
          "${STAGING_LIVEKIT_KEY}": "${STAGING_LIVEKIT_SECRET}"
    depends_on: [redis]
  mailpit:
    <<: *limits
    image: axllent/mailpit@sha256:c076638db1e15662150be4fb62b8a6e96ef6ba5bde90c838a0239225854830f7
    mem_limit: 96m
    networks: [app]
    environment:
      MP_MAX_MESSAGES: "100"
      MP_MAX_AGE: 7d
      MP_WEBROOT: /__mailpit/
      MP_DATABASE: /data/mailpit.db
    volumes: ["mailpit:/data"]

networks:
  edge:
  app:
    internal: true

volumes:
  postgres:
  attachments:
    external: true
    name: coherent-staging_attachments
  vapid:
    external: true
    name: coherent-staging_vapid
  mailpit:
