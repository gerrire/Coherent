name: coherent

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coherent
      POSTGRES_USER: coherent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coherent -d coherent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in deploy/.env}
      DATABASE_URL: postgresql+asyncpg://coherent:${POSTGRES_PASSWORD}@database:5432/coherent
      CORS_ORIGINS: '["https://${PUBLIC_IP:?Set PUBLIC_IP in deploy/.env}","https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in deploy/.env}","https://www.${PUBLIC_DOMAIN}"]'
      COOKIE_SECURE: "true"
      LIVEKIT_URL: wss://${PUBLIC_DOMAIN}:8443
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in deploy/.env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in deploy/.env}
      ATTACHMENT_DIR: /data/attachments
      CHAT_MASTER_KEY_PATH: ${CHAT_MASTER_KEY_PATH:-}
      CLOUD_ENCRYPTION_REQUIRED: ${CLOUD_ENCRYPTION_REQUIRED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@coherent-web.ru}
      E2EE_SETUP_ENABLED: ${E2EE_SETUP_ENABLED:-true}
      ATTACHMENT_STORAGE_LIMIT_MB: ${ATTACHMENT_STORAGE_LIMIT_MB:-15360}
      ATTACHMENT_MIN_FREE_MB: ${ATTACHMENT_MIN_FREE_MB:-2048}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in deploy/.env}
      VAPID_KEY_PATH: /data/vapid/private.pem
      VAPID_SUBJECT: https://${PUBLIC_DOMAIN}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../data/attachments:/data/attachments
      - ../data/vapid:/data/vapid
      - /etc/coherent/keys:/run/coherent-keys:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882-7883
          use_external_ip: true
          interfaces:
            includes:
              - ens3
        redis:
          address: 127.0.0.1:6379
        turn:
          enabled: true
          domain: ${PUBLIC_IP}
          udp_port: 3478
          tls_port: 5349
          cert_file: /etc/letsencrypt/live/coherent-ip/fullchain.pem
          key_file: /etc/letsencrypt/live/coherent-ip/privkey.pem
        keys:
          "${LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in deploy/.env}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in deploy/.env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_started

  monitor-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monitor-bot
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in deploy/.env}
      TELEGRAM_PAIR_CODE: ${TELEGRAM_PAIR_CODE:?Set TELEGRAM_PAIR_CODE in deploy/.env}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in deploy/.env}
      MONITOR_NET_INTERFACE: ens3
    volumes:
      - monitor_bot_state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/monitor-bot-heartbeat') < 90"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  monitor_bot_state:
