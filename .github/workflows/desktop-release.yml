name: Build Coherent for Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  push:
    branches:
      - "**"
    tags:
      - "desktop-v*"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      - name: Configure and build
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag must look like desktop-v1.2.3"
            }
          } else {
            $version = "0.1.0"
          }

          cmake -S desktop -B desktop/build -G "Visual Studio 17 2022" -A x64 "-DCOHERENT_VERSION=$version"
          cmake --build desktop/build --config Release --parallel

      - name: Bundle Qt and LiveKit
        shell: pwsh
        run: |
          $publish = "desktop/build/publish/Release"
          windeployqt --release --qmldir desktop/qml "$publish/Coherent.exe"
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment failed." }
          Copy-Item -LiteralPath "desktop/build/_deps/livekit-sdk/livekit-sdk-windows-x64-1.5.0/bin/livekit.dll" -Destination $publish
          Copy-Item -LiteralPath "desktop/build/_deps/livekit-sdk/livekit-sdk-windows-x64-1.5.0/bin/livekit_ffi.dll" -Destination $publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coherent-windows-build
          path: desktop/build/publish/Release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coherent-windows-build
          path: desktop/build/publish/Release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP "vpk"
          dotnet tool install --tool-path $toolPath vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install the Velopack CLI."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolPath

      - name: Package and publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^desktop-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must look like desktop-v1.2.3"
          }
          vpk pack --packId Coherent.Desktop --packVersion "$version" --packDir desktop/build/publish/Release --mainExe Coherent.exe --packTitle Coherent --packAuthors Coherent --outputDir desktop/Releases
          vpk upload github --outputDir desktop/Releases --repoUrl "https://github.com/${{ github.repository }}" --token "$env:GITHUB_TOKEN" --publish --releaseName "Coherent $version" --tag "$env:GITHUB_REF_NAME"
