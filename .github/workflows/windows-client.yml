name: Windows client

on:
  # Web updates do not build Windows. Desktop releases are requested separately
  # after the web version has been tried, via a manual run or a desktop tag.
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: "Prepare a signed draft release from main or windows-client"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release signing configuration
        if: (github.event_name == 'workflow_dispatch' && inputs.prepare_release) || startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:GITHUB_REF -notin @('refs/heads/main', 'refs/heads/windows-client') -and $env:GITHUB_REF -notlike 'refs/tags/desktop-v*') { throw 'Signed releases require main, windows-client or a desktop version tag' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the original updater key in repository Actions secrets. See docs/desktop-signing.md.' }
          Write-Host 'Updater signing key is configured.'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install frontend and compile shared browser assets
        working-directory: frontend
        run: |
          npm ci
          npm run crypto:build
      - name: Check native Windows behavior
        run: cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --lib
      - name: Compile Windows application
        working-directory: frontend
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-windows-build
          path: frontend/src-tauri/target/release/coherent-desktop.exe
          if-no-files-found: error
      - name: Prepare signed draft release
        if: (github.event_name == 'workflow_dispatch' && inputs.prepare_release && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-client')) || startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing updater signing key' }
          $version = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $publish = $env:GITHUB_REF -like 'refs/tags/desktop-v*'
          if ($publish -and $env:GITHUB_REF -ne "refs/tags/$tag") { throw 'Tag and desktop version differ' }
          if ($publish) {
            git fetch origin main:refs/remotes/origin/main --no-tags
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Published desktop source must be included in main' }
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/build-deploy.yml/runs?branch=main&head_sha=$env:GITHUB_SHA&per_page=10" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not ($runs.workflow_runs | Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.event -eq 'push' -and $_.conclusion -eq 'success' })) { throw 'The exact main commit must pass server and crypto CI before publication' }
          }
          $notes = "docs/releases/desktop-$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          Push-Location frontend
          # Package the executable already compiled and tested above.
          npm run tauri bundle -- --ci --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer build failed' }
          Pop-Location
          ./scripts/clean-desktop-artifacts.ps1
          ./scripts/prepare-desktop-release.ps1 -Notes (Get-Content -LiteralPath $notes -Raw)
          $bundle = 'frontend/src-tauri/target/release/bundle/nsis'
          Push-Location frontend/src-tauri
          try {
            cargo run --release --locked --features tauri/custom-protocol --example verify_desktop_update -- target/release/bundle/nsis/Coherent-setup.exe
            if ($LASTEXITCODE -ne 0) { throw 'Updater signature verification failed' }
          } finally { Pop-Location }
          $checksums = @('Coherent-setup.exe', 'Coherent-setup.exe.sig', 'latest.json') | ForEach-Object {
            $hash = (Get-FileHash "$bundle/$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          [IO.File]::WriteAllLines("$bundle/SHA256SUMS.txt", $checksums, [Text.UTF8Encoding]::new($false))
          $assets = @('Coherent-setup.exe', 'Coherent-setup.exe.sig', 'latest.json', 'SHA256SUMS.txt') | ForEach-Object { "$bundle/$_" }
          if ($publish) {
            gh release create $tag @assets --verify-tag --latest --title "Coherent $version" --notes-file $notes
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --draft --latest=false --title "Coherent $version" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
      - name: Remove superseded desktop downloads
        if: startsWith(github.ref, 'refs/tags/desktop-v') && github.ref == 'refs/tags/desktop-v0.1.3'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep 0.1.3 and the previous signed 0.1.2. Source tags stay intact.
          $obsolete = @{
            'desktop-v0.1.2-manual' = 425582928
            'desktop-v0.1.0' = 423316072
            'desktop-v0.1.1' = 423389564
          }
          foreach ($tag in $obsolete.Keys) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Cannot verify obsolete release $tag" }
            $release = $json | ConvertFrom-Json
            if ($release.id -ne $obsolete[$tag]) { throw "Release $tag has changed; review it manually" }
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Cannot remove obsolete release $tag" }
          }

      - name: Keep the current and previous signed desktop installers
        if: startsWith(github.ref, 'refs/tags/desktop-v') && github.ref == 'refs/tags/desktop-v0.1.4'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/desktop-v0.1.2" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $old.id -ne 425620223) { throw 'Review the previous desktop release before cleanup' }
          gh release delete desktop-v0.1.2 --yes
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove superseded desktop release' }
