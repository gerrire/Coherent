name: Windows client

on:
  push:
    branches: ["**"]
    paths: ["frontend/**", "crates/**", "scripts/*desktop*.ps1", ".github/workflows/windows-client.yml"]
  workflow_dispatch:
    inputs:
      prepare_release:
        description: "Prepare a signed draft release from main"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install frontend and compile shared browser assets
        working-directory: frontend
        run: |
          npm ci
          npm run crypto:build
      - name: Check native Windows behavior
        run: cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --lib
      - name: Compile Windows application
        working-directory: frontend
        run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-windows-build
          path: frontend/src-tauri/target/release/coherent-desktop.exe
          if-no-files-found: error
      - name: Prepare signed draft release
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_release && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set the original updater key as TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets. Do not replace the existing public key.' }
          Push-Location frontend
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer build failed' }
          Pop-Location
          ./scripts/prepare-desktop-release.ps1 -Notes 'Защищённая переписка, управление устройствами, улучшения звонков и стабильности.'
          $bundle = 'frontend/src-tauri/target/release/bundle/nsis'
          $assets = @(Get-ChildItem "$bundle/*.exe", "$bundle/*.sig", "$bundle/latest.json" | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 3) { throw 'Signed installer assets are incomplete' }
          gh release create desktop-v0.1.2 @assets --target $env:GITHUB_SHA --draft --title 'Coherent 0.1.2' --notes-file docs/releases/desktop-0.1.2.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
