name: Build for deployment

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coherent_ci
          POSTGRES_USER: coherent_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coherent_ci -d coherent_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -e 'backend[dev]'
      - name: Check backend and run tests
        run: |
          ruff check backend
          pytest backend/tests -q
      - name: Check PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://coherent_ci:ci-only-password@127.0.0.1:5432/coherent_ci
        run: alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t coherent-api:ci .
      - name: Build website image
        run: docker build -f deploy/Dockerfile.web -t coherent-web:ci .
      - name: Build monitor bot image
        run: docker build -f deploy/Dockerfile.monitor-bot -t coherent-monitor-bot:ci .
