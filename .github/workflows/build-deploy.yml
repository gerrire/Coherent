name: Build for deployment

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    uses: ./.github/workflows/crypto-core.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coherent_ci
          POSTGRES_USER: coherent_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coherent_ci -d coherent_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install -e 'backend[dev]'
      - name: Check backend and run tests
        run: |
          ruff check backend
          pytest backend/tests -q
      - name: Check PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://coherent_ci:ci-only-password@127.0.0.1:5432/coherent_ci
        run: alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
  build:
    permissions:
      contents: write
    needs: [test, crypto]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t coherent-api:${{ github.sha }} .
      - name: Build website image
        run: docker build -f deploy/Dockerfile.web -t coherent-web:${{ github.sha }} .
      - name: Build monitor bot image
        run: docker build -f deploy/Dockerfile.monitor-bot -t coherent-monitor-bot:${{ github.sha }} .

      - name: Publish immutable deployment images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if gh release view "deployment-$DEPLOY_SHA" >/dev/null 2>&1; then exit 0; fi
          mkdir -p release
          docker save "coherent-api:$DEPLOY_SHA" "coherent-web:$DEPLOY_SHA" "coherent-monitor-bot:$DEPLOY_SHA" | gzip -1 > release/images.tar.gz
          python3 - <<'PY'
          import hashlib,importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('deployment','deploy/auto-deploy.py')
          deployment=importlib.util.module_from_spec(spec);spec.loader.exec_module(deployment)
          sha=os.environ['DEPLOY_SHA']
          images={}
          for name in ('coherent-api','coherent-web','coherent-monitor-bot'):
              images[name]=deployment.image_config_digest(f'{name}:{sha}')
          with Path('release/images.tar.gz').open('rb') as source: digest=hashlib.file_digest(source,'sha256').hexdigest()
          Path('release/manifest.json').write_text(json.dumps({'commit':sha,'archive_sha256':digest,'images':images}))
          PY
          gh release create "deployment-$DEPLOY_SHA" release/images.tar.gz release/manifest.json --target "$DEPLOY_SHA" --prerelease --latest=false --title "Server build ${DEPLOY_SHA:0:12}" --notes "Immutable server images produced by the successful deployment workflow."
