name: Windows manual installer

on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-manual-installer.yml]
  workflow_run:
    workflows: [Windows client]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the successful main Windows client build
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-manual-installer
  cancel-in-progress: false

jobs:
  installer:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Locate the verified Windows binary
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $source = $env:REQUESTED_SHA
          if (-not $source) { $source = $env:COMPLETED_SHA }
          if (-not $source) { $source = (git rev-parse HEAD^).Trim() }
          if ($source -notmatch '^[a-f0-9]{40}$') { throw 'A full source commit is required' }
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $name = "coherent-windows-manual-$source"
          "sha=$source" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          $existing = Invoke-RestMethod -Headers $headers -Uri "$api/actions/artifacts?per_page=100"
          if ($existing.artifacts | Where-Object { $_.name -eq $name -and -not $_.expired }) {
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Host 'This source already has a prepared manual installer.'
            exit 0
          }
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            $runs = Invoke-RestMethod -Headers $headers -Uri "$api/actions/workflows/windows-client.yml/runs?branch=main&head_sha=$source&per_page=5"
            $run = $runs.workflow_runs | Where-Object { $_.head_sha -eq $source -and $_.head_branch -eq 'main' } | Select-Object -First 1
            if ($run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw "Windows source build did not succeed: $($run.conclusion)" }
              "run_id=$($run.id)" >> $env:GITHUB_OUTPUT
              'exists=false' >> $env:GITHUB_OUTPUT
              exit 0
            }
            Start-Sleep -Seconds 15
          }
          throw 'Timed out waiting for the verified Windows build'
      - uses: actions/checkout@v4
        if: steps.source.outputs.exists != 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.exists != 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: coherent-windows-build
          path: frontend/src-tauri/target/release
      - uses: actions/setup-node@v4
        if: steps.source.outputs.exists != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare bundling tools
        if: steps.source.outputs.exists != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed' }
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' }
          rustup default 1.99.1
      - name: Bundle manual NSIS installer without an updater signature
        if: steps.source.outputs.exists != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          $config = '{"bundle":{"createUpdaterArtifacts":false}}'
          $config | Set-Content -Encoding utf8 manual-bundle.json
          npm run tauri bundle -- --ci --bundles nsis --config manual-bundle.json
          if ($LASTEXITCODE -ne 0) { throw 'Manual installer bundling failed' }
          Remove-Item manual-bundle.json
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $digest = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installers[0].Name)" | Set-Content -Encoding utf8 src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.exists != 'true'
        with:
          name: ${{ steps.source.outputs.name }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
