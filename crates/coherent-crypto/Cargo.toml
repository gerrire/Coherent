[package]
name = "coherent-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "openmls/js", "getrandom/wasm_js", "getrandom_legacy/js"]
native-vault = ["dep:fs2", "dep:tempfile", "dep:keyring"]

[dependencies]
openmls = "=0.9.2"
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "0.5", features = ["derive", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
hkdf = "0.12"
ed25519-dalek = "2.2"
hpke-rs = { version = "=0.7.0", features = ["rustcrypto"] }
sha2 = "0.10"
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = "1"
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.4"
getrandom_legacy = { package = "getrandom", version = "0.2" }
wasm-bindgen = { version = "=0.2.129", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
